# Paramètres personnels : conservés lors d'une réinstallation.
# Aucun mot de passe ou jeton dans ce fichier.
[desktop]
font = DejaVu Sans Mono
font_size = 10
# auto : deux colonnes sur le portable, trois si assez de cellules disponibles.
layout = auto
gap = 4
border = 1
bar_height = 24
cpu_interval = 2
status_interval = 10

[theme]
background = #020805
foreground = #80e89a
muted = #519565
border = #285b3b
active = #a5ffb9
selection = #80e89a
warning = #e6c56e

[bbs]
host = xibalba.vip
port = 44510
encoding = UTF-8
# green ou standard ; indépendant de l'encodage UTF-8 / CP437.
palette = green
autoconnect = false
# Telnet transmet en clair : utiliser un mot de passe propre au BBS.

[irc]
# Aucun serveur ni salon rejoint tant que ces paramètres sont vides.
host =
port = 6697
network = Retro
nick = retro_user
channels =
tls = true
autoconnect = false

[mastodon]
instance = https://mastodon.social
# Vide : sélection native / dernier profil utilisé de Mastui.
profile =
autoconnect = true
media = off
refresh_interval = 60
